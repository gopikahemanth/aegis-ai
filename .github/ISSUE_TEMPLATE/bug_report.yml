name: 🐛 Bug Report
description: Report a bug, compilation failure, or healer loop crash in Aegis AI
title: "fix: [Description of issue]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the details below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What prompt or command line arguments did you run?
      placeholder: |
        1. Run `node apps/cli/dist/index.js create "..."`
        2. Inspect output logs
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Telemetry Logs
      description: Paste any relevant logs from `.aegis/metrics.json` or console readouts.
